<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AWS Professional Cards</title>
<meta name="description" content="AWS SAP-C03 study deck: professional notes, contrast sets, quick recall and lookup tables in one place.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found]){display:none!important}</style>
<style>
  :root{
    --ground:#F4F6F9;
    --surface:#FFFFFF;
    --ink:#0F141B;
    --muted:#59647A;
    --faint:#8A94A6;
    --line:#DDE3EC;
    --line-soft:#E9EDF3;
    --accent:#B4560A;
    --focus:#2E73B8;
    --chip-ink:#FFFFFF;

    --c-org:#B81065;
    --c-govern:#7A3F8C;
    --c-security:#C01E36;
    --c-compute:#C25E00;
    --c-storage:#2E6B3E;
    --c-cache:#1F6F8B;
    --c-net:#6B36D6;
    --c-dr:#C2410C;
    --c-data:#20629F;
    --c-ops:#0E7C86;
    --c-cost:#5C7C0F;
    --c-migrate:#8A5A00;

    /* keys carried over with the contrast sets, quick recall and lookup tables */
    --c-messaging:#0E7C86;
    --c-lb:#3B5BC0;
    --c-hybrid:#6B36D6;
    --c-k8s:#1F6F8B;
    --c-container:#9A5B12;
    --c-database:#20629F;
    --c-network:#6B36D6;
    --c-integrate:#0E7C86;
    --c-analytics:#127A5B;
    --c-devtools:#3B5BC0;
    --c-edge:#7A3F8C;
    --c-ml:#A03A6E;
    --c-sec:#C01E36;
    --c-app:#0E7C86;

    --fs-display:'IBM Plex Sans Condensed','Helvetica Neue',Arial,sans-serif;
    --fs-body:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,sans-serif;
    --fs-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#0D1117; --surface:#151B24; --ink:#E4E9F1; --muted:#96A1B4;
      --faint:#6C7789; --line:#242C38; --line-soft:#1D242E;
      --accent:#F0912F; --focus:#6BA6E8; --chip-ink:#0D1117;
      --c-org:#F5629F; --c-govern:#C081D6; --c-security:#F2647A; --c-compute:#F08A2E; --c-storage:#6FBF7F; --c-cache:#5FB8D6; --c-net:#A98BFF;
      --c-dr:#E8705C; --c-data:#5BA3E8; --c-ops:#3ECBD4; --c-cost:#A3C93F; --c-migrate:#D9A63C;
      --c-messaging:#3ECBD4; --c-lb:#7E9BF0; --c-hybrid:#A98BFF; --c-k8s:#5FB8D6; --c-container:#D9A05B; --c-database:#5BA3E8; --c-network:#A98BFF;
      --c-integrate:#3ECBD4; --c-analytics:#41C79A; --c-devtools:#7E9BF0; --c-edge:#C081D6; --c-ml:#E77FB0; --c-sec:#F2647A; --c-app:#3ECBD4;
    }
  }
  :root[data-theme="dark"]{
    --ground:#0D1117; --surface:#151B24; --ink:#E4E9F1; --muted:#96A1B4;
    --faint:#6C7789; --line:#242C38; --line-soft:#1D242E;
    --accent:#F0912F; --focus:#6BA6E8; --chip-ink:#0D1117;
    --c-org:#F5629F; --c-govern:#C081D6; --c-security:#F2647A; --c-compute:#F08A2E; --c-storage:#6FBF7F; --c-cache:#5FB8D6; --c-net:#A98BFF;
    --c-dr:#E8705C; --c-data:#5BA3E8; --c-ops:#3ECBD4; --c-cost:#A3C93F; --c-migrate:#D9A63C;
    --c-messaging:#3ECBD4; --c-lb:#7E9BF0; --c-hybrid:#A98BFF; --c-k8s:#5FB8D6; --c-container:#D9A05B; --c-database:#5BA3E8; --c-network:#A98BFF;
    --c-integrate:#3ECBD4; --c-analytics:#41C79A; --c-devtools:#7E9BF0; --c-edge:#C081D6; --c-ml:#E77FB0; --c-sec:#F2647A; --c-app:#3ECBD4;
  }

  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--ground); color:var(--ink);
    -webkit-text-size-adjust:100%;
    font-family:var(--fs-body); font-size:15px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:2.25rem 1.5rem 4rem;}

  header.mast{
    display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;
    gap:1.25rem 2rem;padding-bottom:1rem;border-bottom:2px solid var(--ink);
  }
  .brand h1{
    font-family:var(--fs-display);font-weight:700;
    font-size:clamp(1.9rem,4vw,2.6rem);letter-spacing:-.015em;
    line-height:1.02;margin:0;text-wrap:balance;
  }
  .brand p{
    margin:.4rem 0 0;font-family:var(--fs-mono);font-size:.72rem;
    letter-spacing:.09em;text-transform:uppercase;color:var(--faint);
  }
  .toggle{
    font-family:var(--fs-mono);font-size:.72rem;letter-spacing:.08em;
    text-transform:uppercase;color:var(--muted);background:var(--surface);
    border:1px solid var(--line);border-radius:2px;padding:.55rem .8rem;
    cursor:pointer;display:flex;align-items:center;gap:.5rem;
  }
  .toggle:focus-visible{outline:2px solid var(--focus);outline-offset:1px;}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--line);border:1px solid var(--faint);}
  .controls{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem;}
  .toggle[aria-pressed="true"]{color:var(--chip-ink);background:var(--accent);border-color:var(--accent);}
  .toggle[aria-pressed="true"] .dot{background:var(--chip-ink);border-color:var(--chip-ink);}

  /* filter — searches every row in every part */
  .field{position:relative;display:flex;align-items:center;}
  .field svg{position:absolute;left:.6rem;width:14px;height:14px;stroke:var(--faint);fill:none;stroke-width:1.8;}
  #q{
    font-family:var(--fs-mono);font-size:.8rem;color:var(--ink);background:var(--surface);
    border:1px solid var(--line);border-radius:2px;padding:.5rem .7rem .5rem 1.85rem;
    width:220px;max-width:52vw;
  }
  #q::placeholder{color:var(--faint);}
  #q:focus{outline:2px solid var(--focus);outline-offset:1px;border-color:transparent;}

  .hint{margin:.9rem 0 0;font-size:.85rem;color:var(--muted);max-width:70ch;}
  .hint b{color:var(--ink);font-weight:600;}

  /* jump links to the four parts */
  .parts{
    display:flex;flex-wrap:wrap;gap:.55rem 1.4rem;margin:1rem 0 0;
    font-family:var(--fs-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;
  }
  .parts a{color:var(--muted);text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:.12rem;}
  .parts a:hover{color:var(--ink);border-color:var(--ink);}
  .parts a:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
  .parts a span{color:var(--faint);}

  .stack{display:flex;flex-direction:column;gap:1.75rem;margin-top:1.9rem;}

  /* part heading — one per former deck */
  .part{margin-top:.75rem;padding-top:1.3rem;border-top:2px solid var(--ink);}
  .part:first-child{margin-top:0;padding-top:0;border-top:0;}
  .part h2{
    font-family:var(--fs-display);font-weight:700;font-size:1.6rem;
    letter-spacing:-.01em;line-height:1.1;margin:0;
  }
  .part p{margin:.4rem 0 0;font-size:.85rem;color:var(--muted);max-width:70ch;}
  .part p b{color:var(--ink);font-weight:600;}

  .none{display:none;margin-top:2.5rem;font-family:var(--fs-mono);font-size:.85rem;color:var(--faint);}
  body.empty .none{display:block;}

  section.cl{
    background:var(--surface);
    border:1px solid var(--line-soft);
    border-left:3px solid var(--hue);
    padding:1rem 1.15rem 1.15rem;
  }
  .cl-head{display:flex;align-items:baseline;gap:.7rem;flex-wrap:wrap;}
  .num{
    font-family:var(--fs-mono);font-size:.7rem;font-weight:600;
    color:var(--hue);font-variant-numeric:tabular-nums;
  }
  .cl-head h2{
    font-family:var(--fs-display);font-weight:600;font-size:1.22rem;
    margin:0;flex:1;min-width:12ch;
  }
  .axis{
    margin:.5rem 0 .9rem;font-size:.85rem;color:var(--muted);
  }
  .axis b{
    color:var(--hue);font-weight:600;
  }

  .tw{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;min-width:560px;}
  th{
    text-align:left;font-family:var(--fs-mono);font-size:.66rem;
    letter-spacing:.09em;text-transform:uppercase;color:var(--faint);
    font-weight:500;padding:0 .8rem .45rem 0;border-bottom:1px solid var(--line);
    white-space:nowrap;
  }
  th:last-child,td:last-child{padding-right:0;}
  td{
    padding:.55rem .8rem;vertical-align:top;font-size:.83rem;
    border-bottom:1px solid var(--line-soft);
  }
  td:first-child{padding-left:0;}
  tr:last-child td{border-bottom:0;}
  td.svc{white-space:nowrap;width:1%;}
  td.svc b{
    font-family:var(--fs-mono);font-size:.79rem;font-weight:600;color:var(--hue);
  }
  /* exam-trigger column of a contrast set */
  td.tell{color:var(--muted);}
  td.tell em{font-style:normal;color:var(--ink);font-weight:500;}

  /* name hook under a quick-recall line — kept out of sight in blank mode until the name is revealed */
  .hook{
    display:block;margin-top:.15rem;font-size:.74rem;line-height:1.35;
    color:var(--faint);font-style:italic;
  }
  body.blank tr:not(.on) .hook{display:none;}

  /* blank mode hides the name everywhere except the lookup tables, where it hides the answers */
  body.blank .cl:not(.lookup) td.svc b,
  body.blank td.dest span{
    color:transparent;background:var(--line);border-radius:2px;
    cursor:pointer;display:inline-block;min-width:7rem;
    transition:background .18s ease;
  }
  body.blank .cl:not(.lookup) td.svc b:hover,
  body.blank td.dest span:hover{background:var(--line-soft);}
  body.blank .cl:not(.lookup) td.svc b.on{color:var(--hue);background:none;cursor:default;}
  body.blank td.dest span.on{color:inherit;background:none;cursor:default;}
  @media (prefers-reduced-motion: reduce){*{transition:none !important;}}

  footer{
    margin-top:2.5rem;padding-top:1rem;border-top:1px solid var(--line);
    font-family:var(--fs-mono);font-size:.7rem;letter-spacing:.06em;
    text-transform:uppercase;color:var(--faint);
    display:flex;flex-wrap:wrap;gap:.5rem 1.5rem;justify-content:space-between;
  }

  /* ---- mobile: tables become stacked cards, no sideways scrolling ---- */
  @media (max-width:700px){
    .wrap{padding:1.4rem 1rem 3rem;}
    header.mast{align-items:stretch;gap:.9rem;}
    .controls{width:100%;}
    .field{flex:1 1 100%;}
    #q{width:100%;max-width:none;}
    .toggle{flex:1 1 auto;justify-content:center;padding:.65rem .7rem;}

    .stack{gap:1.15rem;margin-top:1.4rem;}
    .part{margin-top:.5rem;padding-top:1.05rem;}
    .part h2{font-size:1.4rem;}
    section.cl{padding:.9rem .95rem 1rem;}
    .cl-head h2{font-size:1.12rem;}
    .axis{font-size:.82rem;margin-bottom:.75rem;}

    .tw{overflow-x:visible;}
    table{min-width:0;display:block;}
    thead{display:none;}
    tbody{display:block;}
    tr{
      display:block;
      padding:.6rem 0;
      border-bottom:1px solid var(--line-soft);
    }
    tr:last-child{border-bottom:0;padding-bottom:0;}
    td{
      display:block;
      padding:0;
      border:0;
      font-size:.82rem;
    }
    td + td{margin-top:.3rem;}

    td[data-label]:not(.svc)::before{
      content:attr(data-label);
      display:block;
      font-family:var(--fs-mono);
      font-size:.6rem;
      letter-spacing:.09em;
      text-transform:uppercase;
      color:var(--faint);
      margin-bottom:.1rem;
    }
    td.svc{width:auto;white-space:normal;margin-bottom:.15rem;}
    td.svc b{font-size:.86rem;}
    body.blank .cl:not(.lookup) td.svc b,
    body.blank td.dest span{min-width:8rem;}
  }

  @media (max-width:400px){
    .brand h1{font-size:1.7rem;}
    .toggle{font-size:.68rem;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
    <div class="brand">
      <h1>AWS Professional Cards</h1>
      <p><span id="count">0</span> sections &middot; SAP-C03</p>
    </div>
    <div class="controls">
      <label class="field">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5"></circle><path d="M10.5 10.5 14 14"></path></svg>
        <input id="q" type="search" placeholder="filter rows…" autocomplete="off" aria-label="Filter rows">
      </label>
      <button class="toggle" id="blank" aria-pressed="false"><span class="dot"></span>Blank mode</button>
      <button class="toggle" id="shuffle" aria-pressed="false"><span class="dot"></span>Shuffle</button>
    </div>
  </header>

  <p class="hint" id="hint">One deck for SAP-C03: professional notes, contrast sets, quick recall and lookup tables. Turn on <b>Blank mode</b> to hide the names and work backward from the behavior.</p>

  <nav class="parts" id="parts" aria-label="Parts of this deck"></nav>

  <div class="stack" id="stack"></div>
  <p class="none">No row matches that filter.</p>

  <footer>
    <span>Reproduce from blank, then check</span>
    <span>SAP-C03 scope</span>
  </footer>
</div>

<script>
/* The deck has four parts, shown in this order. A cluster names its part with `part`;
   a cluster with no `part` is a professional note. Row shapes by part:
     pro       [term, description]             col:"What it is"
     contrast  [service, trait, examTrigger]   col:["Trait header","Exam trigger"]
     quick     [name, definition, hook?]       hook:true
     lookup    [name, answer, answer2?]        hide:"answer" (blank mode hides the answers, not the name) */
const PARTS = [
  { id:"pro",      title:"Professional notes", note:"Notes at professional depth, built up section by section while studying." },
  { id:"contrast", title:"Contrast sets",      note:"The groups the exam tests as sets &mdash; study them as sets, not one service at a time. Each is organised by its one deciding axis, with the exam phrasing that triggers it." },
  { id:"quick",    title:"Quick recall",       note:"Every service, one line each &mdash; the coverage pass. Services with no near-neighbours carry a <i>name hook</i> underneath, which Blank mode keeps hidden until you reveal the name." },
  { id:"lookup",   title:"Lookup tables",      note:"Where each managed log can be delivered, and which storage services survive an AZ or Region. Here <b>Blank mode</b> hides the answers, not the names. Logs: S3 for retention, CloudWatch Logs for alarms, Firehose for streaming." }
];

const CLUSTERS = [
  /* ---- Professional notes ---- */
  {
    title:"Identity and Federation",
    key:"org",
    axis:"",
    col:"What it is",
    rows:[
      ["IAM Access Analyzer","Analyzes resource policies to find resources reachable from outside your zone of trust. The two findings features detect (external access, unused access). It never enforces (SCP) and never auto-remediates (Config)."],
      ["Zone of trust","The boundary you choose when creating the analyzer &mdash; <b>account</b> or <b>organization</b>."],
      ["Policy validation","Checks a policy you wrote against IAM grammar and best practice. Returns errors, security warnings and suggestions &mdash; catches over-broad wildcards and missing conditions."],
      ["Policy generation","Builds a policy from <b>CloudTrail</b> activity, up to <b>90 days</b> back."],
      ["Assuming a role vs. a resource-based policy","Assume a role and its permissions <b>replace</b> yours; a resource-based policy grants access while you <b>keep</b> your own, so work that needs both sides at once wants a resource-based policy."],
      ["Third-party access &mdash; <b>sts:AssumeRole</b> + external ID","The vendor's AWS account is the principal in your role's trust policy, and that policy requires an <b>ExternalId</b> you issue them; they pass it on the AssumeRole call. Prevents the confused deputy problem."],
      ["STS (Security Token Service)","<b>AssumeRole</b> (cross-account, role switching)<br><b>AssumeRoleWithSAML</b> (enterprise IdP &mdash; AD FS, Okta)<br><b>AssumeRoleWithWebIdentity</b> (Amazon Cognito, Facebook, Google &mdash; AWS recommends Cognito: supports MFA, anonymous users, data sync)<br><b>GetSessionToken</b> (existing IAM user, MFA)<br><b>GetFederationToken</b> (custom identity broker)<br>The three <b>AssumeRole*</b> calls return credentials for a role; the two <b>Get*</b> calls do not."],
      ["AD FS (Active Directory Federation Services)","Provides SSO across applications, issuing <b>SAML</b> assertions to third-party service providers &mdash; AWS Management Console, Dropbox, Office 365."],
      ["AWS Managed Microsoft AD","Actual domain controllers running in AWS. Works on its own, or with on-prem AD over <b>Direct Connect or Site-to-Site VPN</b>. Trust can go <b>both ways</b>; replication is <b>not</b> included by default. If the VPN or DX goes down you lose the on-prem side &mdash; the fix is an on-prem AD replica on <b>EC2</b> in AWS, with two-way trust to and from the managed directory."],
      ["AD Connector","A directory <b>gateway</b> that redirects requests to on-prem AD &mdash; on-prem only, proxied from AWS. <b>No caching, no RDS SQL Server, no trust relationship.</b> Still requires Direct Connect or VPN, and if that connection goes down you have no AD."],
      ["Simple AD","Cheap. <b>No MFA, no RDS SQL Server, no AWS SSO (IAM Identity Center), no trust relationship.</b> Sized for 500 users (Small) up to 5,000 (Large)."],
      ["Amazon Verified Permissions","<b>Fine-grained authorization inside an application you built</b> &mdash; may this user perform this action on this resource? Not for AWS API access, which is IAM.<br>Policies are written in <b>Cedar</b> and kept in a <b>policy store</b> &mdash; one per application, or <b>one per tenant</b> for multi-tenant &mdash; so authorization logic moves out of the application code.<br>The application calls <b>IsAuthorized</b>, or <b>IsAuthorizedWithToken</b> with a JWT from an identity source: a <b>Cognito user pool</b> or an <b>OIDC</b> provider.<br>It <b>does not authenticate</b> anyone; the user has already signed in somewhere else."],
      ["AWS Verified Access","<b>VPN-less</b> access to corporate applications on <b>zero-trust</b> terms &mdash; every request is evaluated, not just the first sign-in.<br>Trust data comes from a <b>user-identity</b> trust provider (<b>IAM Identity Center</b> or any <b>OIDC</b> IdP) and optionally a <b>device</b> trust provider (CrowdStrike, Jamf, JumpCloud). Access policies are written in <b>Cedar</b>.<br>Endpoints front a <b>load balancer</b>, <b>network interface</b>, <b>network CIDR</b> or <b>RDS</b>.<br>A <b>WAF</b> web ACL can be attached, and every access attempt is logged in <b>OCSF</b> format to CloudWatch Logs, S3 or Firehose.<br>Not Verified Permissions &mdash; that authorizes actions <b>inside</b> an application; this decides who may <b>reach</b> it."]
    ]
  },
  {
    title:"Organizations",
    key:"govern",
    axis:"",
    col:"What it is",
    rows:[
      ["SCP scope","Applies to member accounts including their <b>root user</b> &mdash; the only way to constrain root, which ignores IAM policies and permission boundaries. The <b>management account is fully exempt</b>, even with the SCP attached at the organization root. <b>Service-linked roles</b> are exempt everywhere. Caps permissions, never grants them."],
      ["Account scope &mdash; SCP vs Config vs Control Tower","<b>SCP</b>: multi-account only &mdash; an Organizations feature, and no effect on the management account, so it needs member accounts to do anything.<br><b>Config</b>: single <i>or</i> multi &mdash; natively per-account and per-region, with aggregators and organization rules for org-wide coverage.<br><b>Control Tower</b>: multi-account only, and it provisions extra accounts (log archive, audit) as part of the landing zone.<br>Config is the only one of the three that works in a standalone account."],
      ["Control Tower guardrail levels","Three guidance levels (guardrails are now called <b>controls</b>).<br><b>Mandatory</b> &mdash; always on, cannot be disabled: disallow changes to the CloudTrail, Config, IAM roles and log archive that Control Tower itself created, so every one protects its own plumbing.<br><b>Strongly recommended</b> &mdash; AWS best practice, optional: disallow public read/write on S3 buckets, require EBS encryption, disallow non-EBS-optimized instance types.<br><b>Elective</b> &mdash; opt in as needed: disallow S3 bucket deletion without MFA, disallow changes to bucket policy or encryption config, disallow actions as the root user.<br>This is a separate axis from preventive / detective / proactive."],
      ["Control Tower Account Factory","Provisions new accounts from a standardized baseline, and can enroll existing ones. Each account lands in an <b>OU</b>, so that OU's controls apply from the moment it exists. Exposed as a <b>Service Catalog</b> product, which is what lets teams self-service an account without touching Organizations directly. Sets OU placement, an IAM Identity Center user, and optionally a standard VPC."],
      ["AWS RAM (Resource Access Manager)","Shares a resource with named accounts, an <b>OU</b>, or the whole organization. The resource stays owned by your account and <b>nothing is copied</b> &mdash; consumers use it in place, so no peering and no role assumption. Shares inside the organization are auto-accepted once org sharing is enabled; external accounts must accept an invitation.<br><b>Shareable examples:</b> <b>VPC subnets</b>, <b>Transit Gateway</b>, <b>Route 53 Resolver rules</b>, <b>License Manager</b> configurations, <b>AWS Private CA</b>, customer-managed <b>prefix lists</b>, Capacity Reservations and Dedicated Hosts, Network Firewall rule groups, Aurora DB clusters.<br><b>Cannot be shared:</b> subnets in a <b>default VPC</b>, and <b>security groups</b>."]
    ]
  },
  {
    title:"Security",
    key:"security",
    axis:"",
    col:"What it is",
    rows:[
      ["CloudTrail","Records API activity. <b>Management events</b> &mdash; RunInstances or AttachRolePolicy &mdash; are <b>logged by default</b>. <b>Data events</b> &mdash; S3 object-level, Lambda Invoke, DynamoDB item-level &mdash; are <b>not enabled by default</b>; you turn them on deliberately, and they cost real money because the volume is enormous. Create a trail to deliver to S3 or CloudWatch Logs for anything beyond 90 days; an organization trail covers every account."],
      ["CloudTrail Insights","Detects <b>unusual API activity</b> against a learned baseline of management events. Two types: API <b>call rate</b> and API <b>error rate</b>. Enabled explicitly on a trail, charged separately, and needs time to build the baseline before it reports anything. Not known-bad threat intelligence, which is GuardDuty. Examples (inaccurate resource provisioning, bursts of IAM actions, hitting service limits, gaps in management activity)"],
      ["KMS customer managed key","Symmetric (<b>AES-256</b>), asymmetric (RSA, ECC) or HMAC &mdash; <b>the only type that can be asymmetric</b>. You create and control it. Rotation is <b>optional</b> and yours to set &mdash; 365 days by default once enabled, configurable 90&ndash;2560, plus on-demand. Key policy <b>viewable and editable</b>. Usage appears in your CloudTrail."],
      ["KMS AWS managed key","Always a <b>symmetric</b> encryption key. Created for you by an AWS service &mdash; aws/s3, aws/ebs. Rotates automatically every <b>365 days</b> and you cannot change or disable that. Key policy <b>viewable but not editable</b>. Usage appears in your CloudTrail."],
      ["KMS AWS owned key","Always a <b>symmetric</b> encryption key. Lives <b>outside your account</b> and is shared across many accounts. Rotation is entirely AWS's. Key policy <b>neither viewable nor editable</b>. Usage does <b>not</b> appear in your CloudTrail, so its use cannot be audited."],
      ["KMS multi-Region keys","<b>Not global</b> &mdash; a <b>primary plus replicas</b>, and each multi-Region key is <b>managed independently</b>. Only <b>one primary at a time</b>; a replica can be promoted into its own primary. Use cases: disaster recovery, global data management such as DynamoDB Global Tables, active-active applications spanning Regions, and distributed signing applications."],
      ["Secrets Manager","Access is granted with a <b>resource-based policy</b> on the secret &mdash; that is the mechanism for cross-account access.<br>In <b>CloudFormation</b>, three steps:<br><b>generate</b> the secret with GenerateSecretString<br><b>reference</b> it from the consuming resource with a dynamic reference ({{resolve:secretsmanager:...}})<br><b>link</b> it to the database with SecretTargetAttachment, which writes the connection details back into the secret and enables rotation."],
      ["Secrets Manager cross-account access","<b>Four grants, two per side.</b><br>Owner account: the secret's <b>resource policy</b> allows the external principal <b>secretsmanager:GetSecretValue</b>, and the <b>KMS key policy</b> allows it <b>kms:Decrypt</b> plus kms:DescribeKey.<br>Caller account: an identity policy allows GetSecretValue on the secret ARN and kms:Decrypt on the key ARN.<br><b>Gotcha:</b> the secret must be on a <b>customer managed key</b> &mdash; one encrypted with the default aws/secretsmanager key cannot be shared cross-account at all, because an AWS managed key policy is not editable, so there is no way to grant the other account kms:Decrypt."],
      ["RDS security","<b>TDE</b> (Transparent Data Encryption) &mdash; <b>Oracle and SQL Server</b> only, enabled through an option group. Engine-level encryption at rest, layered on top of the KMS volume encryption that all engines get.<br><b>IAM database authentication</b> &mdash; <b>MySQL, PostgreSQL and MariaDB</b> only; connect with a short-lived IAM auth token instead of a password, so there are no database credentials to store or rotate.<br>The two sets do not overlap: commercial engines get TDE, open-source engines get IAM auth."],
      ["ACM-SSL/TLS (AWS Certificate Manager)","<b>Regional service</b> &mdash; a certificate can only be attached to resources in the same Region. For a global application, say ALBs in several Regions, you must issue a separate certificate in <b>each Region</b> where the application is deployed. You <b>cannot copy certificates across Regions</b>. <b>CloudFront is global</b>, so it needs only <b>one certificate</b> for all edge locations &mdash; but that certificate must be issued in <b>us-east-1</b>. Same for an <b>edge-optimized</b> API Gateway, which fronts with CloudFront &mdash; certificate in <b>us-east-1</b>. A <b>regional</b> API Gateway needs its certificate in its own Region."],
      ["CloudHSM","<b>Single-tenant</b> dedicated hardware, where KMS is <b>multi-tenant</b>. AWS provisions the hardware (HSM = Hardware Security Module), but <b>you manage your own keys entirely</b>, not AWS. The device is tamper resistant and <b>FIPS 140-2 Level 3</b> compliant. Supports both <b>symmetric and asymmetric</b> encryption, including SSL/TLS keys. <b>No free tier.</b> You must use the <b>CloudHSM Client Software</b>. A cluster can span multiple AZs, so it is <b>highly available</b>. A natural fit for <b>SSE-C</b>, where you hold the key and supply it on every request and AWS never stores it."],
      ["SSE-S3 vs SSE-KMS","Choose KMS for <b>audit trail</b>, <b>additional security</b>, <b>key control</b> (customer managed key). If KMS request quota is throttled, fix it with <b>S3 bucket keys</b>, cutting down KMS calls."],
      ["S3 Access Logs","Access requests. <b>Hours</b> to deliver, best effort (incomplete)."],
      ["S3 Event Notifications","Certain events (create, remove, restore, replicate). <b>Seconds/minutes</b> to deliver to SQS, SNS, Lambda."],
      ["S3 IAM policy","<b>User based</b> &mdash; attached to an IAM user, group or role."],
      ["S3 Bucket Policies","<b>Resource based</b> &mdash; public access, force objects to be encrypted at upload, grant access to cross account."],
      ["S3 presigned URL","An S3 link signed with your IAM credentials that carries <b>your permissions</b> for a set time, and can authorize an <b>upload</b> as well as a download. Valid for default <b>3600 sec (1hr)</b> or <b>--expires-in</b>."],
      ["CloudFront signed URL","Grants <b>one file</b> through the CDN, signed with a <b>CloudFront key group</b>, with optional <b>IP restriction</b>."],
      ["CloudFront signed cookie","Grants a <b>whole path</b> through the CDN with one cookie and <b>no URL changes</b>, but the client must support cookies."],
      ["S3 Object Lock","Per-object-version <b>WORM</b> on S3, in <b>Governance</b> mode (overridable with the bypass permission) or <b>Compliance</b> mode (nobody, including root), plus an open-ended <b>Legal Hold</b>."],
      ["Glacier Vault Lock","Whole-vault <b>WORM</b> enforced by a policy you lock permanently, with a <b>24-hour validation window</b> before it becomes irreversible."],
      ["S3 Access Point","Manage S3 policy <b>at scale</b> &mdash; instead of one bucket policy per bucket, assign more <b>granular, specific access</b> to each access point, each with its own policy."],
      ["S3 Access Point &mdash; VPC Origin","An access point locked to <b>VPC-only</b> reachability, accessed through a <b>Gateway or Interface VPC endpoint</b> whose endpoint policy must allow <b>both</b> the access point and the underlying bucket."],
      ["S3 Multi-Region Access Point","A single <b>global endpoint</b> spanning buckets in several Regions that routes each request to the <b>lowest-latency</b> bucket, kept in sync by <b>bi-directional replication</b>, with <b>failover controls</b> to shift traffic between Regions in minutes (active-active or active-passive)."],
      ["S3 Object Lambda","Runs a <b>Lambda function that transforms the object as it is retrieved</b>, so one bucket can serve different views of the same data through an <b>Object Lambda Access Point</b> layered over a standard access point &mdash; used for redacting PII, converting formats such as XML to JSON, and resizing or watermarking images per caller."],
      ["WAF managed rule groups","All named <b>AWSManagedRules*</b>.<br><b>Baseline</b> &mdash; general protection from common threats (CommonRuleSet, AdminProtectionRuleSet).<br><b>Use-case specific</b> &mdash; protection for particular stacks (SQLiRuleSet, WindowsRuleSet, PHPRuleSet, WordPressRuleSet).<br><b>IP reputation</b> &mdash; block by source (AmazonIpReputationList, AnonymousIpList).<br><b>Bot Control</b> &mdash; block and manage requests from bots (BotControlRuleSet)."],
      ["WAF logging","Three destinations:<br><b>CloudWatch Logs</b> log group &mdash; 5 MB per second.<br><b>S3</b> bucket &mdash; 5 minute interval.<br><b>Kinesis Data Firehose</b> &mdash; limited by Firehose quotas."],
      ["AWS Firewall Manager","Applies a common <b>security policy</b> &mdash; WAF rules, Shield Advanced, security groups, Network Firewall, Route 53 Resolver DNS Firewall &mdash; across <b>every account in an Organization</b>. Policies are created at the <b>Region</b> level and applied automatically to <b>new resources and future accounts</b>, which is what makes it the compliance answer rather than configuring each account yourself."],
      ["Security groups &mdash; allow only","Security groups have <b>allow rules only</b>; there is no deny rule. Anything not matched by an allow is implicitly denied, and because they are <b>stateful</b>, return traffic is permitted automatically. To <b>explicitly block</b> an IP you need a <b>NACL</b>, which is stateless and does support deny."],
      ["Amazon Inspector","Only for <b>EC2, container images (ECR), and Lambda functions</b>. Scans for <b>CVEs</b> and <b>network reachability</b>. Runs when <b>inventory or CVE updates</b>. Reports in <b>AWS Security Hub</b> and sends findings to <b>EventBridge</b>."],
      ["AWS Config","Records your resource configurations and their <b>changes over time</b> so you can audit compliance &mdash; is SSH unrestricted, are any buckets public, how did this ALB change? <b>SNS alerts</b> on any change. <b>Per-Region</b>, but can be <b>aggregated across Regions and accounts</b>."],
      ["AWS Config Rules","<b>Custom rules</b> written in Lambda, evaluated on <b>each config change</b> and/or at <b>regular intervals</b>, firing <b>EventBridge</b> when non-compliant and optionally <b>auto-remediating through SSM Automations</b>."],
      ["GuardDuty","Uses <b>ML</b>, <b>30 day trial</b>, <b>no software to install</b>. Inputs: <b>CloudTrail logs, VPC Flow Logs, DNS logs, Kubernetes audit logs</b>. <b>EventBridge rule</b> for notification to SNS or Lambda. Protects against <b>cryptocurrency attacks</b>."],
      ["AWS Security Hub","The central <b>multi-account dashboard</b> that <b>automates security checks</b> and <b>aggregates findings</b> from Config, GuardDuty, Inspector, Macie, IAM Access Analyzer, Systems Manager, Firewall Manager, Health and partner tools. <b>Requires AWS Config to be enabled first.</b> Generates <b>EventBridge</b> events, and findings can be investigated with <b>Amazon Detective</b>."],
      ["Amazon Security Lake","A managed <b>data lake for security logs</b>, held in <b>S3 buckets you own</b>. It collects logs and events across accounts and Regions, converts them to <b>Apache Parquet</b> and normalizes them to <b>OCSF</b> (Open Cybersecurity Schema Framework).<br><b>Native sources:</b> CloudTrail management and data events (S3, Lambda), VPC Flow Logs, Route 53 Resolver query logs, Security Hub findings, EKS audit logs, WAFv2 logs &mdash; plus custom and third-party sources.<br><b>Multi-account:</b> the Organizations management account designates a <b>delegated administrator</b>; <b>rollup Regions</b> consolidate data from contributing Regions.<br><b>Subscribers:</b> <b>data access</b> (notified of new objects through an HTTPS endpoint or SQS) or <b>query access</b> (Lake Formation tables queried with Athena).<br>This stores the normalized logs; Security Hub aggregates <b>findings</b>."]
    ]
  },
  {
    title:"Compute and Load Balancing",
    key:"compute",
    axis:"",
    col:"What it is",
    rows:[
      ["EC2 instance types","<b>R</b> &mdash; a lot of RAM; in-memory caches.<br><b>C</b> &mdash; good CPU; compute / databases.<br><b>M</b> &mdash; balanced (think &ldquo;medium&rdquo;); general / web app.<br><b>I</b> &mdash; good local I/O (instance storage); databases.<br><b>G</b> &mdash; GPU; video rendering / machine learning.<br><b>T2 / T3</b> &mdash; burstable instances, up to a capacity.<br><b>T2 / T3 unlimited</b> &mdash; unlimited burst."],
      ["EC2 placement groups","Controls the instance placement strategy.<br><b>Cluster</b> &mdash; packs instances into a low-latency group in a <b>single AZ</b>.<br><b>Spread</b> &mdash; spreads instances across distinct underlying hardware, <b>max 7 per group per AZ</b>; critical applications.<br><b>Partition</b> &mdash; spreads instances across many partitions, each on a different set of racks, within an AZ. Scales to <b>hundreds</b> of instances per group (Hadoop, Cassandra, Kafka)."],
      ["Moving an instance between placement groups","You <b>can</b> move an instance into or out of a placement group, in three steps:<br><b>stop</b> the instance<br>use the CLI &mdash; <b>modify-instance-placement</b><br><b>start</b> the instance."],
      ["EC2 Graviton","ARM processors giving the <b>best price performance</b>. Supports many Linux distributions &mdash; Amazon Linux 2, RedHat, SUSE, Ubuntu &mdash; but <b>not available for Windows</b>.<br><b>Graviton2</b> &mdash; 40% better price performance than comparable 5th generation x86 instances.<br><b>Graviton3</b> &mdash; up to 3x better performance than Graviton2.<br>Use cases: app servers, microservices, HPC, CPU-based ML, video encoding, gaming, in-memory caches."],
      ["EC2 instance recovery","A CloudWatch alarm on <b>StatusCheckFailed_System</b> &mdash; the underlying hardware, as opposed to <b>StatusCheckFailed_Instance</b> which checks the VM &mdash; that recovers the instance and can alert an <b>SNS topic</b> at the same time. Recovery preserves the <b>same private, public and Elastic IPs, metadata and placement group</b>."],
      ["EC2 Enhanced Networking","Uses the <b>Elastic Network Adapter (ENA)</b>."],
      ["Elastic Fabric Adapter (EFA)","Improved ENA for <b>HPC</b>, <b>only for Linux</b>."],
      ["ECS / EKS storage","<b>Choosing:</b><br>One task or pod, block, high IOPS &rarr; <b>EBS</b>, and you are pinned to one AZ.<br>Many, across AZs &rarr; <b>EFS</b>.<br>Windows &rarr; <b>FSx for Windows</b>.<br>HPC &rarr; <b>FSx for Lustre</b>.<br>Fargate plus persistent storage &rarr; <b>EFS</b> is the safe answer every time.<br><b>ECS supports:</b> EFS, EBS, FSx for Windows.<br><b>EKS supports:</b> EBS, EFS, Lustre, ONTAP/OpenZFS &mdash; everything goes through a <b>CSI driver</b>.<br><b>EKS on Fargate supports EFS only.</b>"],
      ["Gateway Load Balancer","<b>GENEVE</b> protocol on port <b>6081</b>. Sits as the middle man between the source, <b>third-party virtual appliances</b>, and then the destination application &mdash; so traffic is inspected in transit without the appliances being addressed directly."],
      ["Cross zone load balancing","Evenly splits traffic <b>per target</b> in all AZs.<br><b>ALB</b> &mdash; on by default, free.<br><b>NLB / GWLB</b> &mdash; off by default, pay transfer fee."],
      ["ALB routing","<b>Round Robin</b> and <b>Least Outstanding Request</b>."],
      ["NLB routing","<b>Flow Hash</b>."],
      ["API Gateway limits","<b>10 MB</b> max payload, <b>29s</b> timeout, <b>300s</b> cache TTL (min 0, max 3600)."],
      ["API Gateway observability","CloudWatch <b>Metrics</b> aggregate per stage &mdash; Count, 4XX/5XX, Latency vs IntegrationLatency.<br>CloudWatch <b>Logs</b> are per-request within the gateway &mdash; access logs for who/what/status, execution logs for authorizer and mapping-template internals.<br><b>X-Ray</b> traces one request <b>across services</b> to show which downstream hop is slow."],
      ["API Gateway WebSocket API / @connections","<b>Stateful two-way communication</b>."],
      ["API Gateway Private API","Requires a <b>VPC interface endpoint</b>, and you must allow it in the API Gateway <b>resource policy</b> &mdash; <b>aws:SourceVpc</b> or <b>aws:SourceVpce</b>."],
      ["AWS AppSync","Managed <b>GraphQL</b> API. Single endpoint querying many data sources (DynamoDB, Aurora, Lambda, OpenSearch, HTTP). <b>Real-time subscriptions</b> over WebSocket, <b>offline sync</b> for mobile. Auth via API key, IAM, Cognito, or OIDC."],
      ["Route 53 CNAME vs Alias","<b>CNAME</b> &mdash; maps a name to any other hostname. Not valid at the zone apex, charged per query.<br><b>Alias</b> &mdash; points at an AWS resource. Works at the apex <em>and</em> subdomains, free queries, native health check. Alias is always type <b>A or AAAA</b>, never CNAME. Pair an A with an AAAA for dual-stack &mdash; that's the classic &ldquo;select TWO&rdquo; answer. <b>Never targets an EC2 instance.</b> Except for Alias, TTL is mandatory for each DNS record.<br><b>Both</b> CNAME and Alias track changing IPs, because both resolve to a name rather than a fixed address &mdash; only a <b>non-alias A record</b> breaks when IPs change."],
      ["Route 53 Traffic Flow","Creates and maintains records in <b>complex configurations</b>. Used for <b>geoproximity bias</b> config. Saved as a <b>Traffic Flow Policy</b>."],
      ["AWS Application Auto Scaling","Scaling for everything that is <b>not an EC2 Auto Scaling group</b>. You register a <b>scalable target</b> with a minimum and maximum capacity, then attach target tracking, step, scheduled or predictive scaling, depending on the resource.<br><b>Scales:</b> <b>ECS services</b> (task count), <b>DynamoDB</b> tables and GSIs (provisioned capacity), <b>Aurora replicas</b>, <b>Lambda provisioned concurrency</b>, SageMaker AI endpoint variants, ElastiCache replication groups, EMR clusters, Spot Fleet requests, Keyspaces tables, MSK broker storage, Neptune clusters, and custom resources.<br>&ldquo;DynamoDB auto scaling&rdquo; and &ldquo;ECS service auto scaling&rdquo; are this service underneath."]
    ]
  },
  {
    title:"Storage",
    key:"storage",
    axis:"",
    col:"What it is",
    rows:[
      ["Amazon Data Lifecycle Manager (DLM)","Automates the creation, retention and deletion of <b>EBS snapshots and EBS-backed AMIs</b>. Schedules backups, cross-account snapshot copies, and deletion of outdated backups.<br>Uses resource <b>tags</b> to identify what to act on (EC2 instances, EBS volumes).<br><b>Cannot</b> manage snapshots or AMIs created <b>outside DLM</b>.<br><b>Cannot</b> manage <b>instance-store backed AMIs</b>."],
      ["DLM vs AWS Backup","<b>DLM</b> &mdash; automate creation, retention and deletion of <b>EBS snapshots</b>.<br><b>AWS Backup</b> &mdash; manage and monitor backups <b>across the AWS services you use</b>, including EBS, from a <b>single place</b>."],
      ["Storage Class Analysis vs Storage Lens","<b>S3 Storage Class Analysis</b> &mdash; <b>one bucket</b> (optionally by prefix or tag). Tells you <b>when to transition Standard &rarr; Standard-IA</b>; daily CSV export plus a console chart, and needs ~30 days of observation to mean anything.<br><b>S3 Storage Lens</b> &mdash; <b>organization-wide</b> across all buckets, accounts and Regions. Usage and activity metrics plus cost-optimization recommendations; free tier is usage only at bucket level with 14-day retention, paid advanced tier adds activity, prefix-level detail and 15-month retention.<br><b>Intelligent-Tiering</b> is the third option &mdash; Storage Class Analysis tells you what to configure, Intelligent-Tiering just does it, so it usually wins on &ldquo;least operational effort&rdquo;."],
      ["Storage Lens metric categories","<b>Summary</b> &mdash; StorageBytes, ObjectCount. Find the fastest-growing or unused buckets and prefixes.<br><b>Cost-Optimization</b> &mdash; NonCurrentVersionStorageBytes, IncompleteMultipartUploadStorageBytes. Find incomplete multipart uploads older than 7 days, or objects to move to a cheaper class.<br><b>Data-Protection</b> &mdash; VersioningEnabledBucketCount, MFADeleteEnabledBucketCount, SSEKMSEnabledBucketCount, CrossRegionReplicationRuleCount. Find buckets not following best practice.<br><b>Access-management</b> &mdash; ObjectOwnershipBucketOwnerEnforcedBucketCount. Which Object Ownership setting each bucket uses.<br><b>Event</b> &mdash; EventNotificationEnabledBucketCount.<br><b>Performance</b> &mdash; TransferAccelerationEnabledBucketCount.<br><b>Activity</b> &mdash; AllRequests, GetRequests, PutRequests, ListRequests, BytesDownloaded.<br><b>Detailed Status Code</b> &mdash; 200OKStatusCount, 403ForbiddenErrorCount, 404NotFoundErrorCount."],
      ["Storage Lens free vs paid","<b>Free</b> &mdash; automatic for all customers, around <b>28 usage metrics</b>, queryable for <b>14 days</b>.<br><b>Advanced Metrics and Recommendations</b> (paid) &mdash; Activity, Advanced Cost Optimization, Advanced Data Protection and Status Code metrics; <b>CloudWatch publishing</b> at no additional charge; <b>prefix-level aggregation</b>; queryable for <b>15 months</b>."],
      ["FSx replication / migration","<b>SnapMirror</b> means <b>ONTAP</b>.<br><b>Lustre</b> has <b>no multi-AZ</b> and leans on <b>S3</b> instead.<br><b>Windows</b> has no native replication, so <b>DataSync or Backup</b>.<br><b>Cannot change an existing file system</b> &mdash; all FSx types have to create a new file system and move data into it to <b>decrease volume size</b> or to replicate. Increasing is fine."],
      ["AWS DataSync","Moves large amounts of data.<br>On-premises or another cloud to AWS (NFS, SMB, HDFS, S3 API) &mdash; <b>needs an agent</b>.<br>AWS to AWS between storage services &mdash; <b>no agent</b>.<br>Synchronizes to <b>S3</b> (any storage class, including Glacier), <b>EFS</b>, and <b>FSx</b> (Windows, Lustre, NetApp, OpenZFS).<br>Replication tasks scheduled <b>hourly, daily or weekly</b>.<br><b>File permissions and metadata are preserved</b> (NFS POSIX, SMB).<br>One agent task can use <b>10 Gbps</b>, and you can set a bandwidth limit."],
      ["AWS Data Exchange","Marketplace for subscribing to <b>third-party datasets</b>, delivered to <b>S3, Redshift, or APIs</b>."]
    ]
  },
  {
    title:"Caching",
    key:"cache",
    axis:"",
    col:"What it is",
    rows:[
      ["CloudFront Functions vs Lambda@Edge","<b>CloudFront Functions</b> &mdash; changes <b>viewer</b> requests and responses only. <b>Free tier.</b> Header manipulation and URL redirects.<br><b>Viewer Request</b>: after CloudFront receives a request from a viewer.<br><b>Viewer Response</b>: before CloudFront forwards the response to the viewer.<br><b>Lambda@Edge</b> &mdash; changes <b>CloudFront</b> requests and responses, all four trigger points. <b>No free tier.</b> Can access <b>external services</b> for processing before reaching the origin.<br><b>Viewer Request</b>: after CloudFront receives a request from a viewer.<br><b>Origin Request</b>: before CloudFront forwards the request to the origin.<br><b>Origin Response</b>: after CloudFront receives the response from the origin.<br><b>Viewer Response</b>: before CloudFront forwards the response to the viewer."],
      ["ElastiCache","AWS takes care of <b>OS maintenance, backups and monitoring</b>, but it does involve <b>heavy application code changes</b>.<br><b>Redis</b> &mdash; multi-AZ with <b>auto failover</b>, read replicas, <b>persistent</b>, append only file (AOF), backup and restore.<br><b>Memcached</b> &mdash; multi-node for <b>partitioning / sharding</b>, <b>non-persistent</b>, serverless backup and restore, <b>multi-threaded</b>."]
    ]
  },

      ["DynamoDB indexes","You can only query by <b>partition key + sort key</b>, or by an <b>index</b>.<br><b>LSI</b> (Local Secondary Index) &mdash; keeps the <b>same partition key</b>, alternate sort key, defined at <b>creation time</b>.<br><b>GSI</b> (Global Secondary Index) &mdash; can change <b>both keys</b>, defined <b>after the table is created</b>."],
      ["Failover targets","<b>RDS Multi-AZ</b> &rarr; <b>standby replica</b> (not readable).<br><b>Aurora</b> &rarr; <b>Aurora replica</b> (readable).<br><b>DynamoDB</b> &rarr; none; uses <b>Global Tables</b> across Regions.<br><b>No snapshots</b> are used for failover for any of these databases."],
      ["Convert RDS to Aurora","Uses a <b>snapshot</b> or a <b>read replica</b>."]

  {
    title:"Analytics",
    key:"data",
    axis:"",
    col:"What it is",
    rows:[
      ["Amazon AppFlow","Managed, <b>no-code</b> transfer of data between <b>SaaS applications</b> (Salesforce, SAP, ServiceNow, Slack, Zendesk) and AWS services such as <b>S3</b> and <b>Redshift</b>.<br>Flows run <b>on demand</b>, <b>on a schedule</b> (full or incremental) or <b>on an event</b> from the SaaS application, and can map, filter and validate fields on the way.<br>Encrypted in transit and at rest; <b>PrivateLink</b> keeps the transfer off the public internet for SaaS applications that support it, such as Salesforce and Snowflake.<br>The tell is a <b>SaaS source</b> &mdash; DataSync moves files, DMS moves databases."],
      ["AWS Clean Rooms","Lets you and partner companies <b>analyze your combined datasets without revealing the underlying data to each other</b>. Data is <b>read in place</b> &mdash; S3 through the Glue Data Catalog, Athena or Snowflake &mdash; not copied into a shared store.<br>You create a <b>collaboration</b>, invite other AWS accounts as members, and each member contributes <b>configured tables</b> protected by an <b>analysis rule</b>:<br><b>Aggregation</b> &mdash; only COUNT, SUM and AVG statistics come out.<br><b>List</b> &mdash; row-level output of the overlap between tables.<br><b>Custom</b> &mdash; queries approved in advance as analysis templates.<br>Extra controls: <b>differential privacy</b>, <b>cryptographic computing</b> (data stays encrypted while it is queried) and <b>ML lookalike modeling</b>.<br>Lake Formation grants a partner access to the tables themselves; this only lets them run restricted queries."]

  {
    title:"Monitoring and Operations",

const stack = document.getElementById('stack');
const nav = document.getElementById('parts');
const partOf = c => PARTS.some(p => p.id === c.part) ? c.part : PARTS[0].id;
const plain = h => h.replace(/<[^>]*>/g,'');

PARTS.forEach(p => {
  const list = CLUSTERS.filter(c => partOf(c) === p.id);
  if (!list.length) return;

  const ph = document.createElement('div');
  ph.className = 'part';
  ph.id = `part-${p.id}`;
  ph.innerHTML = `<h2>${p.title}</h2><p>${p.note}</p>`;
  stack.append(ph);
  nav.insertAdjacentHTML('beforeend', `<a href="#part-${p.id}">${p.title} <span>${list.length}</span></a>`);

  /* sections are numbered within their part */
  list.forEach((c, i) => {
    const answers = c.hide === 'answer';
    const sec = document.createElement('section');
    sec.className = answers ? 'cl lookup' : 'cl';
    sec.dataset.part = p.id;
    sec.style.setProperty('--hue', `var(--c-${c.key})`);

    const head = document.createElement('div');
    head.className = 'cl-head';
    head.innerHTML = `<span class="num">${String(i+1).padStart(2,'0')}</span><h2>${c.title}</h2>`;
    sec.append(head);

    if (c.axis) {
      const axis = document.createElement('p');
      axis.className = 'axis';
      axis.innerHTML = `Deciding axis: <b>${c.axis}</b>`;
      sec.append(axis);
    }

    /* one column per entry in col; cells beyond that are ignored, except a quick-recall hook */
    const cols = Array.isArray(c.col) ? c.col : [c.col];
    const tw = document.createElement('div');
    tw.className = 'tw';
    const body = c.rows.map(r => {
      const name = answers ? `<b>${r[0]}</b>` : `<b tabindex="0" role="button">${r[0]}</b>`;
      const cells = cols.map((h, j) => {
        const v = r[j+1] === undefined ? '' : r[j+1];
        if (answers) return `<td class="dest" data-label="${plain(h)}"><span tabindex="0" role="button">${v}</span></td>`;
        if (j > 0) return `<td class="tell" data-label="${plain(h)}">${v}</td>`;
        const hook = c.hook && r[2] ? `<span class="hook">${r[2]}</span>` : '';
        return `<td data-label="${plain(h)}">${v}${hook}</td>`;
      }).join('');
      return `<tr><td class="svc" data-label="Service">${name}</td>${cells}</tr>`;
    }).join('');
    tw.innerHTML =
      `<table><thead><tr><th>Service</th>${cols.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table>`;
    sec.append(tw);

    stack.append(sec);
  });
});

document.getElementById('count').textContent = CLUSTERS.length;

/* blank mode: click a hidden name (or, in a lookup table, a hidden answer) to reveal it */
const HIDDEN = '.cl:not(.lookup) td.svc b, td.dest span';
function reveal(el){
  if (!document.body.classList.contains('blank')) return;
  el.classList.add('on');
  if (el.matches('td.svc b')) el.closest('tr').classList.add('on');
}
stack.addEventListener('click', e => {
  const b = e.target.closest(HIDDEN);
  if (b) reveal(b);
});
stack.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches(HIDDEN)) {
    e.preventDefault();
    reveal(e.target);
  }
});

/* filter — hides rows that don't match, then any section or part left with nothing to show */
const q = document.getElementById('q');
const allRows = Array.from(stack.querySelectorAll('tbody tr'));
allRows.forEach(tr => {
  tr.dataset.k = Array.from(tr.cells, td => td.textContent).join(' ').toLowerCase();
});
q.addEventListener('input', () => {
  const term = q.value.trim().toLowerCase();
  allRows.forEach(tr => { tr.hidden = !!term && !tr.dataset.k.includes(term); });
  let any = false;
  stack.querySelectorAll('section.cl').forEach(sec => {
    const shown = sec.querySelector('tbody tr:not([hidden])') !== null;
    sec.hidden = !shown;
    if (shown) any = true;
  });
  stack.querySelectorAll('.part').forEach(ph => {
    const id = ph.id.replace('part-', '');
    ph.hidden = !stack.querySelector(`section.cl[data-part="${id}"]:not([hidden])`);
  });
  document.body.classList.toggle('empty', !any);
});

/* shuffle — within each cluster's table; toggling off restores the original order */
const shuf = document.getElementById('shuffle');
const original = new Map();
document.querySelectorAll('section.cl tbody').forEach(tb => {
  original.set(tb, Array.from(tb.querySelectorAll('tr')));
});
shuf.addEventListener('click', () => {
  const on = shuf.getAttribute('aria-pressed') !== 'true';
  shuf.setAttribute('aria-pressed', String(on));
  original.forEach((rows, tb) => {
    const order = rows.slice();
    if (on) for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    order.forEach(r => tb.append(r));
  });
});

const btn = document.getElementById('blank');
const hint = document.getElementById('hint');
btn.addEventListener('click', () => {
  const on = document.body.classList.toggle('blank');
  btn.setAttribute('aria-pressed', String(on));
  if (!on) document.querySelectorAll('td.svc b.on, td.dest span.on, tr.on').forEach(el => el.classList.remove('on'));
  hint.innerHTML = on
    ? 'Names hidden. Read across the row and name it before you click &mdash; at professional level the row you can describe but not name is the one that will cost you. In the lookup tables it is the answers that are hidden.'
    : 'One deck for SAP-C03: professional notes, contrast sets, quick recall and lookup tables. Turn on <b>Blank mode</b> to hide the names and work backward from the behavior.';
});
